<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="velum-bg" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252321"/>
      <stop offset="100%" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="velum-rim" x1="64" y1="9" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="velum-wing-left" x1="32" y1="34" x2="64" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFEAE1"/>
      <stop offset="100%" stop-color="#D6D0C5"/>
    </linearGradient>
    <linearGradient id="velum-wing-right" x1="96" y1="34" x2="64" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E3B581"/>
      <stop offset="100%" stop-color="#C0854B"/>
    </linearGradient>
    <linearGradient id="velum-fold" x1="64" y1="74" x2="77" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141210" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#velum-bg)" stroke="#35322E" stroke-width="1.5"/>
  <rect x="9.25" y="9.25" width="109.5" height="109.5" rx="26.75" stroke="url(#velum-rim)" stroke-width="1"/>

  <!-- Left ivory wing -->
  <path d="M 30.6 34.0
           H 45.0
           C 46.6 34.0 47.8 34.8 48.5 36.2
           L 64.0 66.0
           V 96.0
           C 64.0 96.0 62.5 95.8 61.7 94.5
           L 28.8 37.4
           C 27.9 35.8 28.9 34.0 30.6 34.0 Z"
        fill="url(#velum-wing-left)"/>

  <!-- Right amber wing -->
  <path d="M 64.0 66.0
           L 79.5 36.2
           C 80.2 34.8 81.4 34.0 83.0 34.0
           H 97.4
           C 99.1 34.0 100.1 35.8 99.2 37.4
           L 66.3 94.5
           C 65.5 95.8 64.0 96.0 64.0 96.0
           Z"
        fill="url(#velum-wing-right)"/>

  <!-- Smooth spine fold shadow without clipPath for universal Qt/browser SVG compatibility -->
  <path d="M 64.0 66.0
           L 79.5 36.2
           C 80.2 34.8 81.4 34.0 83.0 34.0
           H 97.4
           C 99.1 34.0 100.1 35.8 99.2 37.4
           L 66.3 94.5
           C 65.5 95.8 64.0 96.0 64.0 96.0
           Z"
        fill="url(#velum-fold)"/>
</svg>
