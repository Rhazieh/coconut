<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="coco-husk" x1="16" y1="26" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#87542C"/>
      <stop offset="100%" stop-color="#472A14"/>
    </linearGradient>
    <linearGradient id="coco-shell-edge" x1="28" y1="14" x2="108" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6B682"/>
      <stop offset="100%" stop-color="#AE7038"/>
    </linearGradient>
    <linearGradient id="coco-flesh" x1="34" y1="22" x2="102" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F2E8"/>
      <stop offset="100%" stop-color="#DDD4C3"/>
    </linearGradient>
    <linearGradient id="coco-hollow" x1="50" y1="40" x2="88" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171513"/>
      <stop offset="100%" stop-color="#292522"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed tilted roasted dark coconut husk -->
  <circle cx="57" cy="69" r="55" fill="url(#coco-husk)" stroke="#2F1B0C" stroke-width="1.5"/>

  <!-- Cut toasted-amber shell edge -->
  <circle cx="68" cy="58" r="51" fill="url(#coco-shell-edge)"/>

  <!-- Warm cream coconut flesh -->
  <circle cx="68" cy="58" r="41" fill="url(#coco-flesh)"/>

  <!-- Recessed warm-dark hollow -->
  <circle cx="68" cy="58" r="23.5" fill="url(#coco-hollow)"/>

  <!-- Crisp upper highlight arc along cream rim -->
  <path d="M 44 37 A 32 32 0 0 1 85 32" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="2.4" stroke-linecap="round"/>
</svg>
