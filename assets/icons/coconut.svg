<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="coco-bg" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252321"/>
      <stop offset="100%" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="coco-rim" x1="64" y1="9" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="coco-husk" x1="34" y1="38" x2="90" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B4E2A"/>
      <stop offset="100%" stop-color="#4A2D17"/>
    </linearGradient>
    <linearGradient id="coco-shell-edge" x1="40" y1="32" x2="92" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFAC77"/>
      <stop offset="100%" stop-color="#A86D38"/>
    </linearGradient>
    <linearGradient id="coco-flesh" x1="44" y1="38" x2="88" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F0E6"/>
      <stop offset="100%" stop-color="#DDD4C5"/>
    </linearGradient>
    <linearGradient id="coco-hollow" x1="54" y1="48" x2="78" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171513"/>
      <stop offset="100%" stop-color="#262320"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#coco-bg)" stroke="#35322E" stroke-width="1.5"/>
  <rect x="9.25" y="9.25" width="109.5" height="109.5" rx="26.75" stroke="url(#coco-rim)" stroke-width="1"/>

  <!-- Outer 3D tilted dark husk -->
  <circle cx="60.5" cy="67.5" r="34.5" fill="url(#coco-husk)"/>

  <!-- Cut shell rim -->
  <circle cx="66.5" cy="60.5" r="32.5" fill="url(#coco-shell-edge)"/>

  <!-- Warm cream coconut flesh -->
  <circle cx="66.5" cy="60.5" r="26.5" fill="url(#coco-flesh)"/>

  <!-- Recessed warm-dark hollow -->
  <circle cx="66.5" cy="60.5" r="16.2" fill="url(#coco-hollow)"/>

  <!-- Delicate upper highlight arc along cream rim -->
  <path d="M 49.5 47.0 A 21.5 21.5 0 0 1 78.0 42.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
</svg>
