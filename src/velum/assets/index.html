<!DOCTYPE html>
<html lang="en" data-theme="warm-dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' qrc:; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; img-src 'self' file: data: https: http:; object-src 'none'; frame-src 'none';">
  <title>Velum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar" aria-hidden="true"></div>

  <div id="app-layout">
    <aside id="toc-sidebar" class="sidebar-hidden" aria-label="Outline">
      <div id="toc-header">
        <span id="toc-doc-title">Velum</span>
      </div>
      <nav id="toc-list"></nav>
    </aside>

    <main id="reader-scroll" tabindex="-1">
      <section id="welcome" class="hidden" aria-label="Welcome">
        <div class="welcome-card">
          <div class="welcome-mark" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 128 128" fill="none">
              <path d="M 26 26 H 44 C 46 26 47.4 27 48.2 28.6 L 64 60 V 96 C 64 96 62.2 95.6 61.3 94 L 24 30 C 23 28.2 24.2 26 26 26 Z" fill="#EAE5DC"/>
              <path d="M 64 60 L 79.8 28.6 C 80.6 27 82 26 84 26 H 102 C 103.8 26 105 28.2 104 30 L 66.7 94 C 65.8 95.6 64 96 64 96 Z" fill="#D4A373"/>
            </svg>
          </div>
          <h1>Velum</h1>
          <p id="welcome-sub" class="welcome-sub">Drop a <code>.md</code> file here or open one from disk.</p>
          <button id="btn-welcome-open" type="button" class="primary-btn">Open file…</button>
          <div id="recent-block" class="hidden">
            <div id="recent-label" class="recent-label">Recent</div>
            <ul id="recent-list"></ul>
          </div>
          <p class="welcome-hints">
            <span id="hint-open">Ctrl+O Open</span>
            <span id="hint-zoom">Ctrl+/− Text</span>
            <span id="hint-theme">Ctrl+T Palette</span>
            <span id="hint-toc">Ctrl+B Outline</span>
          </p>
        </div>
      </section>

      <article id="content" class="prose"></article>
    </main>
  </div>

  <div id="controls" role="toolbar" aria-label="Reading controls">
    <button id="btn-toc" type="button" class="ctrl-btn" title="Outline (Ctrl+B)" aria-label="Toggle outline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <line x1="9" y1="4" x2="9" y2="20"/>
      </svg>
    </button>
    <button id="btn-open" type="button" class="ctrl-btn" title="Open file (Ctrl+O)" aria-label="Open file">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </button>
    <span class="ctrl-sep" aria-hidden="true"></span>
    <button id="btn-font-dec" type="button" class="ctrl-btn ctrl-text" title="Decrease text size (Ctrl+-)" aria-label="Decrease text size">A−</button>
    <button id="font-size-value" type="button" class="ctrl-btn ctrl-size" title="Reset text size (Ctrl+0)" aria-label="Current text size">18</button>
    <button id="btn-font-inc" type="button" class="ctrl-btn ctrl-text" title="Increase text size (Ctrl++)" aria-label="Increase text size">A+</button>
    <span class="ctrl-sep" aria-hidden="true"></span>
    <button id="btn-theme" type="button" class="ctrl-btn" title="Palette (Ctrl+T)" aria-label="Switch color palette">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v2M12 19v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M3 12h2M19 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>

  <div id="find-bar" class="hidden" role="search" aria-label="Find in document">
    <input id="find-input" type="text" placeholder="Find…" autocomplete="off" spellcheck="false" aria-label="Search text">
    <button id="find-prev" type="button" class="ctrl-btn" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
    <button id="find-next" type="button" class="ctrl-btn" title="Next (Enter)" aria-label="Next match">↓</button>
    <button id="find-close" type="button" class="ctrl-btn" title="Close (Esc)" aria-label="Close search">✕</button>
  </div>

  <div id="drop-overlay" class="hidden" aria-hidden="true">
    <div id="drop-box" class="drop-box">Drop file to read</div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="polite"></div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="reader.js"></script>
</body>
</html>
